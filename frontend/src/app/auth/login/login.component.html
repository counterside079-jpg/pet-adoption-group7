<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;">
  <div style="width: 100%; max-width: 420px; background: var(--bg-ffffff); border-radius: 20px; padding: 36px 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center;">
    <div style="font-size: 44px; margin-bottom: 8px;">🐾</div>
    <h1 style="font-size: 24px; font-weight: 800; color: var(--fg-15803d); margin: 0 0 6px 0;">{{ 'เข้าสู่ระบบ' | t }}</h1>
    <p style="font-size: 14px; color: var(--fg-64748b); margin: 0 0 20px 0;">{{ 'สำหรับสมาชิกและเจ้าหน้าที่' | t }}</p>

    <div *ngIf="info" style="background: var(--bg-eff6ff); color: var(--fg-1d4ed8); border: 1px solid var(--bd-bfdbfe); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; text-align: left;">
      ℹ️ {{ (info) | t }}
    </div>

    <form (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
      <label for="login-email" style="font-size: 14px; font-weight: 600; color: var(--fg-334155);">{{ 'อีเมล' | t }}</label>
      <input id="login-email" type="email" name="email" [(ngModel)]="email" (input)="errorMessage = ''"
        autocomplete="username" placeholder="you@example.com"
        style="padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--bd-cbd5e1); font-size: 15px; width: 100%;" />

      <label for="login-password" style="font-size: 14px; font-weight: 600; color: var(--fg-334155); margin-top: 4px;">{{ 'รหัสผ่าน' | t }}</label>
      <input id="login-password" type="password" name="password" [(ngModel)]="password" (input)="errorMessage = ''"
        autocomplete="current-password" [placeholder]="'กรอกรหัสผ่าน' | t"
        style="padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--bd-cbd5e1); font-size: 15px; width: 100%;"
        [style.borderColor]="errorMessage ? 'var(--bd-ef4444)' : 'var(--bd-cbd5e1)'" />

      <div *ngIf="errorMessage" style="color: var(--fg-dc2626); font-size: 13px; font-weight: 600; white-space: pre-line;">⚠️ {{ (errorMessage) | t }}</div>

      <button type="submit" [disabled]="loading"
        style="margin-top: 8px; background: #15803d; color: #ffffff; border: none; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;"
        [style.opacity]="loading ? 0.6 : 1">
        {{ (loading ? 'กำลังตรวจสอบ...' : 'เข้าสู่ระบบ') | t }}
      </button>
    </form>

    <p style="font-size: 14px; color: var(--fg-475569); margin: 20px 0 0 0;">
      {{ 'ยังไม่มีบัญชี?' | t }}
      <a routerLink="/register" [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}" style="color: var(--fg-15803d); font-weight: 700;">{{ 'สมัครสมาชิก' | t }}</a>
    </p>
    <a routerLink="/" style="display: inline-block; margin-top: 12px; font-size: 14px; color: var(--fg-475569); text-decoration: none;">{{ '← กลับหน้าหลัก' | t }}</a>
  </div>
</div>
