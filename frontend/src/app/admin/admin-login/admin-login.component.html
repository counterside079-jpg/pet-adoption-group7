<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;">
  <div style="width: 100%; max-width: 400px; background: #ffffff; border-radius: 20px; padding: 36px 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center;">
    <div style="font-size: 44px; margin-bottom: 8px;">🔒</div>
    <h1 style="font-size: 24px; font-weight: 800; color: #15803d; margin: 0 0 6px 0;">สำหรับเจ้าหน้าที่</h1>
    <p style="font-size: 14px; color: #64748b; margin: 0 0 24px 0;">กรอกรหัสผ่านเพื่อเข้าหน้าจัดการระบบ</p>

    <form (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 12px; text-align: left;">
      <label for="admin-password" style="font-size: 14px; font-weight: 600; color: #334155;">รหัสผ่าน</label>
      <input
        id="admin-password"
        type="password"
        name="password"
        [(ngModel)]="password"
        (input)="errorMessage = ''"
        autocomplete="current-password"
        placeholder="กรอกรหัสผ่าน"
        style="padding: 12px 16px; border-radius: 12px; border: 1.5px solid #cbd5e1; font-size: 15px; outline: none; width: 100%; box-sizing: border-box;"
        [style.borderColor]="errorMessage ? '#ef4444' : '#cbd5e1'"
      />

      <div *ngIf="errorMessage" style="color: #dc2626; font-size: 13px; font-weight: 600;">
        ⚠️ {{ errorMessage }}
      </div>

      <button
        type="submit"
        style="margin-top: 8px; background: #15803d; color: #ffffff; border: none; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;"
      >
        เข้าสู่หน้าจัดการ
      </button>
    </form>

    <a routerLink="/" style="display: inline-block; margin-top: 20px; font-size: 14px; color: #475569; text-decoration: none;">← กลับหน้าหลัก</a>
  </div>
</div>
